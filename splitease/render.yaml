services:
  - type: web
    name: splitease
    runtime: static
    rootDir: splitease
    buildCommand: npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_URL
        sync: false
  - type: web
    name: splitease-api
    runtime: node
    rootDir: splitease
    buildCommand: npm ci && npm run build --workspace backend
    startCommand: npm run start --workspace backend
    envVars:
      - key: PORT
        value: "10000"
      - key: CORS_ORIGIN
        value: "https://splitease.tech"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
