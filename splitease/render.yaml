services:
  - type: web
    name: splitease
    runtime: node
    rootDir: splitease
    buildCommand: npm ci && npm run build --workspace backend && npm run build --workspace frontend
    startCommand: npm run start --workspace backend
    envVars:
      - key: PORT
        value: "10000"
      - key: CORS_ORIGIN
        value: "https://splitease.tech"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
